version: '3.8'

services:
  raksham-backend:
    build: .
    command: python backend/run.py
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  raksham-frontend:
    build: .
    command: sh -c "cd frontend && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - raksham-backend
